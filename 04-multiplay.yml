- name: Multi-playbook Example
  hosts: local
  connection: local
  tasks:
    - name: Print Hello World
      ansible.builtin.debug:
        msg: "Hello World"
    - name: Print Hello World
      ansible.builtin.debug:
        msg: "Hello World"

- name: Playbook 2
  hosts: local
  connection: local
  tasks:
    - name: Print Hello World
      ansible.builtin.debug:
        msg: "Hello World"
    - name: Print Hello World
      ansible.builtin.debug:
        msg: "Hello World"